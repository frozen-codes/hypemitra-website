    <!-- Suppress benign Vite WebSocket HMR errors in proxy/iframe environment per environment constraint -->
    <script>
      (function () {
        var origError = console.error;
        console.error = function () {
          var msg = arguments.length > 0 ? String(arguments[0]) : '';
          if (
            msg.indexOf('WebSocket closed without opened') !== -1 ||
            msg.indexOf('[vite] WebSocket') !== -1 ||
            msg.indexOf('failed to connect to websocket') !== -1
          ) {
            return;
          }
          origError.apply(console, arguments);
        };

        window.addEventListener('error', function (e) {
          var msg = e && e.message ? String(e.message) : '';
          if (
            msg.indexOf('WebSocket closed without opened') !== -1 ||
            msg.indexOf('WebSocket') !== -1
          ) {
            e.preventDefault();
            e.stopPropagation();
          }
        });

        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          window.WebSocket = function (url, protocols) {
            if (
              typeof url === 'string' &&
              (url.indexOf('vite') !== -1 || url.indexOf('@vite') !== -1)
            ) {
              return {
                readyState: 3,
                close: function () {},
                send: function () {},
                addEventListener: function (type, handler) {
                  if (type === 'close') {
                    setTimeout(function () {
                      try {
                        handler({ wasClean: true });
                      } catch (err) {}
                    }, 50);
                  }
                },
                removeEventListener: function () {},
              };
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
        }
      })();
    </script>
